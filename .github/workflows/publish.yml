name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to npm Registry
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (final check)
        run: npm run lint

      - name: Check formatting (final check)
        run: npm run format:check

      - name: Run test suite (final check)
        run: npm test

      - name: Validate detectors (final check)
        run: npm run validate:campaigns

      - name: Check dependencies (final check)
        run: npm audit --audit-level=high

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            VALIDATION.md
            detection-rates.json
            fp-analysis.json
          body: |
            # npm-scan ${{ github.ref_name }}

            ## Release Summary
            - **Campaign Detection**: 100% (3/3 real attacks)
            - **False Positive Rate**: 0.0% (0/990 packages)
            - **Tests**: All 671 passing
            - **Code Quality**: 0 linting errors

            ## Validation Metrics
            - D6 (Version Anomaly): 92% avg confidence
            - D7 (Obfuscation): 80% avg confidence
            - D1 (Typosquat): 87.9% avg confidence

            See [VALIDATION.md](./VALIDATION.md) for full metrics.

            **Published with npm provenance attestation (SLSA Level 2).**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}